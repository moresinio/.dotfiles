# sub config load
source=~/.config/mango/rules.conf
source=~/.config/mango/bind.conf
source=~/.cache/hellwal/mangowc.conf
source=~/.config/mango/env.conf

exec_once=hypridle
exec_once=~/.config/mango/autostart.sh

sync_obj_enable=1

# Window effect
blur=1
blur_layer=1
blur_optimized=0
blur_params_num_passes = 2
blur_params_radius = 9
blur_params_noise = 0.02
blur_params_brightness = 0.7
blur_params_contrast = 0.7
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating = 0
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=7
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.2

# Animation Configuration(support type:zoom,slide, fade, none)
# tag_animation_direction: 0-horizontal,1-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=0
animation_fade_out=0
tag_animation_direction=0
zoom_initial_ratio=0.3
zoom_end_ratio=0.8

animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.5
fade_out_begin_opacity=1

animation_duration_move=700
animation_duration_open=500
animation_duration_tag=300
animation_duration_close=400
animation_curve_open=0.46,1.0,0.29,0.99
animation_curve_move=0.46,1.0,0.29,0.99
animation_curve_tag=0.46,1.0,0.29,0.99
animation_curve_close=0.46,1.0,0.29,0.99
animation_curve_focus=0.46,1.0,0.29,0.99
animation_curve_opacity_fade_in=0.46,1.0,0.29,0.99
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5

# Scroller Layout Setting
scroller_structs=9
scroller_default_proportion=0.9
scroller_focus_center=0
edge_scroller_pointer_focus=0
scroller_ignore_proportion_single=0
scroller_prefer_center=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.9,1.0

# Master-Stack Layout Setting (tile,spiral,dwindle)
new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=0
center_master_overspread=0
center_when_single_stack=1

# Overview Setting
hotarea_size=10
hotarea_corner=2 # top-left top-right bottom-left bottom-right
enable_hotarea=1
# ov_tab_mode=1
overview_gap_inner=5
overview_gap_outer=1

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=1
enable_floating_snap=1
snap_distance=30
cursor_size=20
drag_tile_to_tile=1
drag_warp_cursor=0
scratchpad_cross_monitor=1
view_current_to_back=1



# Appearance
gap_outer_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=3
gap_inner_horizontal=3
border_px=2


