# sub config load
source=~/.config/mango/rules.conf
source=~/.config/mango/bind.conf
source=~/.cache/hellwal/mangowc.conf
source=~/.config/mango/env.conf

exec-once=hypridle

syncobj_enable=1

# Window effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 9
blur_params_noise = 0.02
blur_params_brightness = 0.7
blur_params_contrast = 0.7
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating = 0
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=7
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.7

# Animation Configuration(support type:zoom,slide, fade, none)
# tag_animation_direction: 0-horizontal,1-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=0
animation_fade_out=0
tag_animation_direction=0
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=1.0
animation_duration_move=700
animation_duration_open=500
animation_duration_tag=300
animation_duration_close=400
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
#animation_curve_tag=0.46,1.0,0.29,1
animation_curve_tag=0.9,1,0.1,0.9
animation_curve_close=0.86,0,0.07,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.9
scroller_focus_center=0
scroller_prefer_center=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.9,1.0

# Master-Stack Layout Setting (tile,spiral,dwindle)
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=1
overviewgappi=5
overviewgappo=1

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
bypass_surface_visibility=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=1
enable_floating_snap=1
snap_distance=30
cursor_size=20
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=300
numlockon=0
  
# Trackpad 
# need relogin to make it apply
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=1
swipe_min_threshold=20

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
accel_profile 0
accel_speed=-0.1

# Appearance
gappih=5
gappiv=5
gappoh=3
gappov=3
borderpx=2

xkb_rules_layout=us,ru
xkb_rules_options=altwin:menu_win,grp:alt_shift_toggle

