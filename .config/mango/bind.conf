# keyboard
repeat_rate=25
repeat_delay=300
numlock_on=0

xkb_rules_layout=us,ru
xkb_rules_options=altwin:menu_win,grp:alt_shift_toggle

# reload config
bind=SUPER+SHIFT,R,reload_config

# menu and terminal
bindr=SUPER,Return,spawn,footclient
bind=SUPER,z,spawn,fuzzel
bindr=SUPER+SHIFT,Z,spawn,bash ~/.local/bin/powermenu.sh

# Light
# bind=none,XF86MonBrightnessUp,spawn,light -A 20
# bind=none,XF86MonBrightnessDown,spawn,light -U 20
bind=NONE,XF86MonBrightnessUp,spawn, brightnessctl -c "backlight" set +3%
bind=NONE,XF86MonBrightnessDown,spawn, brightnessctl -c "backlight" set 3%-

# volume
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle


# app
# bindr=SUPER,F1,spawn,~/Downloads/zen/zen
bindr=SUPER,F2,spawn,footclient -T Yazi yazi
bindr=SUPER,F3,spawn,footclient -T Neovim nvim
bindr=SUPER,F12,spawn,bash ~/.local/bin/wllchng.sh
bindr=SUPER+SHIFT,G,spawn,bash ~/.config/waybar/scripts/gammastep/gamma_toggle.sh
bindr=SUPER,space,spawn,dpms-off
bindr=none,Print,spawn,grim
bindr=Shift,Print,spawn,grim -g "$(slurp)"

# exit
bindr=SUPER+SHIFT,E,quit
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER,m,zoom

# switch window status
bind=SUPER,y,toggleglobal,
bind=ALT,Tab,togglejump,
bind=SUPER+SHIFT,space,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
# bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,a,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,
bind=CTRL,Left,viewtoleft_have_client,
bind=SUPER,Right,viewtoright,
bind=CTRL,Right,viewtoright_have_client,
bind=CTRL+SUPER,Left,tagtoleft,
bind=CTRL+SUPER,Right,tagtoright,

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5, view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1
bind=Super+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# monitor switch
bind=SUPER+SHIFT,o,focusmon,left
#bind=SUPER,o,tagmon,left

# movewin
bind=SUPER+SHIFT,k,smartmovewin,up
bind=SUPER+SHIFT,j,smartmovewin,down
bind=SUPER+SHIFT,h,smartmovewin,left
bind=SUPER+SHIFT,l,smartmovewin,right

# resizewin
bind=SUPER+ALT,k,smartresizewin,up
bind=SUPER+ALT,j,smartresizewin,down
bind=SUPER+ALT,h,smartresizewin,left
bind=SUPER+ALT,l,smartresizewin,right

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=0
mouse_middle_button_emulation=1

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Trackpad 
# need relogin to make it apply
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
swipe_min_threshold=20

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

